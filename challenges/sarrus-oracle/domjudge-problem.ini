# DOMjudge-specific overrides - read from the ZIP alongside problem.yaml.
# These values override what problem.yaml sets.
#
# timelimit: per-test-case time limit in seconds (keep in sync with problem.yaml limits.time_limit)
# color:     balloon color shown on the scoreboard (hex or CSS color name)
# points:    score value (default 1 for ICPC pass/fail)
timelimit=3
color=#F4A261
points=1
